# Lint, tests and container build (AGENTS.md: pytest green, ruff clean).
# No job talks to the real Telegram API: the smoke test points the bot at a
# closed local port, so the poller just keeps retrying in the background.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -f deploy/Dockerfile -t switchboard:ci .
      - name: Start container with dummy config
        run: |
          docker run -d --name sb -p 127.0.0.1:8080:8080 \
            -e SWITCHBOARD_BOT_TOKEN=123456:ci-dummy-token \
            -e SWITCHBOARD_TELEGRAM_USER_ID=1 \
            -e SWITCHBOARD_TELEGRAM_CHAT_ID=1 \
            -e 'SWITCHBOARD_PRODUCER_KEYS={"ci":"ci-dummy-producer-token-0123456789abcdef"}' \
            -e SWITCHBOARD_TELEGRAM_API_BASE=http://127.0.0.1:9 \
            -e SWITCHBOARD_BIND_HOST=0.0.0.0 \
            switchboard:ci
      - name: Health returns 200
        run: |
          for _ in $(seq 30); do
            curl -fsS http://127.0.0.1:8080/health && exit 0
            sleep 1
          done
          exit 1
      - name: Event is accepted (202)
        run: |
          status=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H 'Authorization: Bearer ci-dummy-producer-token-0123456789abcdef' \
            -H 'Content-Type: application/json' \
            -d '{"destination":"owner","kind":"event","topic":"ci.smoke","severity":"info","message":"CI smoke test"}' \
            http://127.0.0.1:8080/api/v1/messages)
          echo "status=$status"
          test "$status" = 202
      - name: Container logs
        if: always()
        run: docker logs sb
